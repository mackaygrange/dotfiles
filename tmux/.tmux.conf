set-option -sg escape-time 50
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",kitty:RGB"

#set indices to start at one, because 0 is far on the keyboard
set -g base-index 1
set -g mouse on
setw -g pane-base-index 1

set -s set-clipboard off
#set-hook -g pane-set-clipboard 'refresh-client -l'

#renumber windows when one closes
set-option -g renumber-windows on
bind c new-window -c "#{pane_current_path}"

set-window-option -g automatic-rename off
set-window-option -g mode-keys vi

set -g status-left ' '

#set scrollback history limit
set -g history-limit 10000

# Reload tmux config
bind r source-file ~/.tmux.conf

# Open fzf window with man pages, opens up man page in horizontal split
bind m split-pane -h "man -k . | fzf --tiebreak=begin --color=base16 --tmux | awk '{ print $1 $2 }' | xargs man"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -sel clipboard -i'
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel -b"
bind-key -n -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel -b"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin '2kabhishek/tmux-tilit'
# set -g @plugin 'ofirgall/tmux-browser'
# set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
# set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'ofirgall/tmux-window-name'
# set -g @plugin 'idevtier/tmux-cargo'

# set -g @tilit-navigator 'on'
# set -g @tilit-default 'tiled'

set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'moon' # Options are 'main', 'moon' or 'dawn'

set -g @rose_pine_host 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_date_time 'on'
set -g @rose_pine_directory 'on'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_left_separator ' > ' # The strings to use as separators are 1-space padded
set -g @rose_pine_right_separator ' < ' # Accepts both normal chars & nerdfont icons
set -g @rose_pine_field_separator '  ' # Default is two-space-padded, but can be set to anything
set -g @rose_pine_window_separator ' - ' # Replaces the default `:` between the window number and name

set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'

run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# --- Custom theme overrides (applied AFTER plugins load) ---
# BEGIN_TMUX_THEME
run-shell 'bash /home/mgrange/repos/dotfiles/theme/.tmux-override-colors.sh'
set -g status-style "fg=#36f9f6,bg=default"
set -g message-style "fg=#6c6783,bg=default"
set -g message-command-style "fg=#262335,bg=#fede5d"
set -g pane-border-style "fg=#504a6e"
set -g pane-active-border-style "fg=#fede5d"
set -g display-panes-active-colour "#e0d9f5"
set -g display-panes-colour "#fede5d"
set -g mode-style "bg=#3f3a56,fg=#e0d9f5"
set -gw window-status-style "fg=#b893ce,bg=default"
set -gw window-status-current-style "fg=#fede5d,bg=default"
set -gw window-status-activity-style "fg=#ff7edb,bg=default"
set -gw clock-mode-colour "#fe4450"
# END_TMUX_THEME

